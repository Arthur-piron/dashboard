# Lets WebSocket upgrades (SignalR) pass through the proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path is handled by React Router, so serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api/ goes to the ASP.NET container, with the /api prefix removed:
    #   http://localhost:8081/api/about.json  ->  http://server:8080/about.json
    location /api/ {
        proxy_pass http://server:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
