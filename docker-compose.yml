services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    command: ["--smtp-disable-rdns"]
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  server:
    build:
      context: .
      dockerfile: DashboardBackEnd/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Database=dashboard;Username=dashboard;Password=${POSTGRES_PASSWORD:-dashboard}
      Jwt__Key: ${JWT_KEY:-local-default-jwt-signing-key-override-it-in-dot-env}
      Jwt__Issuer: DashboardBackEnd
      Jwt__Audience: DashboardFrontEnd
      Email__Host: mailpit
      Email__Port: 1025
      Email__From: no-reply@dashboard.local
      Frontend__Url: ${FRONTEND_URL:-http://localhost:8081}
      DataProtection__KeysPath: /keys
      GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      GitHub__CallbackUrl: ${GITHUB_CALLBACK_URL:-http://localhost:8081/api/services/github/oauth/callback}
      Admin__Email: ${ADMIN_EMAIL:-}
      Oidc__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Oidc__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Oidc__Google__CallbackUrl: ${GOOGLE_CALLBACK_URL:-http://localhost:8081/api/auth/oidc/google/callback}
      Oidc__Microsoft__ClientId: ${MICROSOFT_CLIENT_ID:-}
      Oidc__Microsoft__ClientSecret: ${MICROSOFT_CLIENT_SECRET:-}
      Oidc__Microsoft__CallbackUrl: ${MICROSOFT_CALLBACK_URL:-http://localhost:8081/api/auth/oidc/microsoft/callback}
      Oidc__Microsoft__Tenant: ${MICROSOFT_TENANT:-901cb4ca-b862-4029-9306-e5cd0f6d9f86}
    volumes:
      - dataprotection-keys:/keys
    ports:
      - "8080:8080"

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: DashboardBackEnd.Tests/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ConnectionStrings__Default: Host=db;Database=dashboard;Username=dashboard;Password=${POSTGRES_PASSWORD:-dashboard}
      Jwt__Key: ${JWT_KEY:-local-default-jwt-signing-key-override-it-in-dot-env}
      Jwt__Issuer: DashboardBackEnd
      Jwt__Audience: DashboardFrontEnd
      Email__Host: mailpit
      Email__Port: 1025
      Email__From: no-reply@dashboard.local
      Frontend__Url: http://localhost:8081
      MAILPIT_URL: http://mailpit:8025

  client:
    build:
      context: .
      dockerfile: DashboardFrontEnd/Dockerfile
    depends_on:
      - server
    ports:
      - "8081:80"

volumes:
  postgres-data:
  dataprotection-keys:
